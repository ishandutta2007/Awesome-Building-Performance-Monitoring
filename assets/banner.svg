<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#051329" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981">
        <animate attributeName="stop-color" values="#10b981; #06b6d4; #3b82f6; #10b981" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4; #3b82f6; #10b981; #06b6d4" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6; #10b981; #06b6d4; #3b82f6" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="energyFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="bldgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- CSS Animations -->
    <style>
      .pulse-fast {
        animation: pulseAnimation 2s infinite ease-in-out;
      }
      .pulse-slow {
        animation: pulseAnimation 3.5s infinite ease-in-out;
      }
      .pulse-delayed {
        animation: pulseAnimation 2.8s infinite ease-in-out 1.2s;
      }
      .dash-flow {
        stroke-dasharray: 8, 6;
        animation: dashMove 20s linear infinite;
      }
      .wave-flow {
        animation: waveFloat 6s ease-in-out infinite alternate;
      }
      .shimmer-text {
        animation: shimmer 5s linear infinite;
      }
      @keyframes pulseAnimation {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.25); opacity: 1; filter: drop-shadow(0 0 8px #06b6d4); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes waveFloat {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes shimmer {
        0% { opacity: 0.9; }
        50% { opacity: 1; }
        100% { opacity: 0.9; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="320" rx="16" fill="url(#bgGrad)" />
  <rect width="960" height="320" rx="16" fill="none" stroke="url(#glowGrad)" stroke-width="2" opacity="0.6" />

  <!-- Grid Pattern -->
  <g opacity="0.12">
    <path d="M0,40 H960 M0,80 H960 M0,120 H960 M0,160 H960 M0,200 H960 M0,240 H960 M0,280 H960" stroke="#38bdf8" stroke-width="1" />
    <path d="M80,0 V320 M160,0 V320 M240,0 V320 M320,0 V320 M400,0 V320 M480,0 V320 M560,0 V320 M640,0 V320 M720,0 V320 M800,0 V320 M880,0 V320" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Background Buildings Silhouette -->
  <g opacity="0.35" transform="translate(620, 70)">
    <!-- Building 1 -->
    <rect x="0" y="70" width="45" height="170" fill="url(#bldgGrad)" rx="2" stroke="#334155" stroke-width="1" />
    <circle cx="12" cy="90" r="2.5" fill="#38bdf8" class="pulse-slow" />
    <circle cx="32" cy="90" r="2.5" fill="#10b981" class="pulse-fast" />
    <circle cx="12" cy="115" r="2.5" fill="#38bdf8" />
    <circle cx="32" cy="115" r="2.5" fill="#f59e0b" class="pulse-delayed" />
    <circle cx="12" cy="140" r="2.5" fill="#10b981" />
    <circle cx="32" cy="140" r="2.5" fill="#38bdf8" class="pulse-fast" />
    <circle cx="12" cy="165" r="2.5" fill="#38bdf8" class="pulse-slow" />
    <circle cx="32" cy="165" r="2.5" fill="#10b981" />

    <!-- Building 2 (Tallest) -->
    <rect x="55" y="20" width="65" height="220" fill="url(#bldgGrad)" rx="3" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <line x1="87" y1="5" x2="87" y2="20" stroke="#06b6d4" stroke-width="2" />
    <circle cx="87" cy="5" r="3.5" fill="#ef4444" class="pulse-fast" />
    <!-- Grid of windows -->
    <g fill="#38bdf8" opacity="0.75">
      <rect x="65" y="35" width="8" height="6" rx="1" />
      <rect x="82" y="35" width="8" height="6" rx="1" fill="#10b981" />
      <rect x="100" y="35" width="8" height="6" rx="1" />
      <rect x="65" y="55" width="8" height="6" rx="1" fill="#f59e0b" />
      <rect x="82" y="55" width="8" height="6" rx="1" />
      <rect x="100" y="55" width="8" height="6" rx="1" fill="#10b981" />
      <rect x="65" y="75" width="8" height="6" rx="1" />
      <rect x="82" y="75" width="8" height="6" rx="1" fill="#38bdf8" />
      <rect x="100" y="75" width="8" height="6" rx="1" />
      <rect x="65" y="95" width="8" height="6" rx="1" fill="#10b981" />
      <rect x="82" y="95" width="8" height="6" rx="1" />
      <rect x="100" y="95" width="8" height="6" rx="1" fill="#38bdf8" />
      <rect x="65" y="115" width="8" height="6" rx="1" />
      <rect x="82" y="115" width="8" height="6" rx="1" fill="#10b981" />
      <rect x="100" y="115" width="8" height="6" rx="1" />
      <rect x="65" y="135" width="8" height="6" rx="1" fill="#38bdf8" />
      <rect x="82" y="135" width="8" height="6" rx="1" />
      <rect x="100" y="135" width="8" height="6" rx="1" fill="#10b981" />
      <rect x="65" y="155" width="8" height="6" rx="1" />
      <rect x="82" y="155" width="8" height="6" rx="1" fill="#f59e0b" />
      <rect x="100" y="155" width="8" height="6" rx="1" />
    </g>

    <!-- Building 3 -->
    <rect x="130" y="50" width="55" height="190" fill="url(#bldgGrad)" rx="2" stroke="#334155" stroke-width="1" />
    <circle cx="145" cy="75" r="2.5" fill="#10b981" class="pulse-fast" />
    <circle cx="168" cy="75" r="2.5" fill="#38bdf8" />
    <circle cx="145" cy="100" r="2.5" fill="#38bdf8" class="pulse-slow" />
    <circle cx="168" cy="100" r="2.5" fill="#10b981" />
    <circle cx="145" cy="125" r="2.5" fill="#f59e0b" />
    <circle cx="168" cy="125" r="2.5" fill="#38bdf8" class="pulse-delayed" />
    <circle cx="145" cy="150" r="2.5" fill="#10b981" />
    <circle cx="168" cy="150" r="2.5" fill="#38bdf8" />

    <!-- Building 4 -->
    <rect x="195" y="90" width="50" height="150" fill="url(#bldgGrad)" rx="2" stroke="#334155" stroke-width="1" />
    <circle cx="210" cy="110" r="2.5" fill="#38bdf8" class="pulse-slow" />
    <circle cx="230" cy="110" r="2.5" fill="#10b981" class="pulse-fast" />
    <circle cx="210" cy="135" r="2.5" fill="#10b981" />
    <circle cx="230" cy="135" r="2.5" fill="#38bdf8" />
    <circle cx="210" cy="160" r="2.5" fill="#38bdf8" />
    <circle cx="230" cy="160" r="2.5" fill="#f59e0b" class="pulse-slow" />
  </g>

  <!-- Animated Telemetry & Energy Sine Waves -->
  <g class="wave-flow">
    <!-- Telemetry curve 1 -->
    <path d="M40,240 Q160,180 280,225 T520,200 T760,230 T920,185" fill="none" stroke="url(#glowGrad)" stroke-width="3" filter="url(#glow)" opacity="0.85" />
    <!-- Telemetry curve 2 (Dashed flow) -->
    <path d="M40,260 Q180,210 320,250 T600,220 T820,255 T940,210" fill="none" stroke="#10b981" stroke-width="1.8" class="dash-flow" opacity="0.6" />
    <!-- Data curve 3 -->
    <path d="M40,220 Q200,270 360,210 T680,240 T880,195 T940,220" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.45" />
  </g>

  <!-- Glowing Telemetry Sensor Nodes -->
  <g transform="translate(0, 0)">
    <circle cx="280" cy="225" r="5" fill="#06b6d4" class="pulse-fast" filter="url(#glow)" />
    <circle cx="520" cy="200" r="5.5" fill="#10b981" class="pulse-slow" filter="url(#glow)" />
    <circle cx="760" cy="230" r="5" fill="#3b82f6" class="pulse-delayed" filter="url(#glow)" />
  </g>

  <!-- Header & Typography Content -->
  <g transform="translate(56, 68)">
    <!-- Pill Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="280" height="28" rx="14" fill="#0f172a" stroke="#06b6d4" stroke-width="1.2" opacity="0.9" />
      <circle cx="14" cy="14" r="4.5" fill="#10b981" class="pulse-fast" />
      <text x="28" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1">CURATED AWESOME ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="68" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="33" font-weight="800" letter-spacing="-0.5">
      Awesome Building Performance
    </text>
    <text x="0" y="108" fill="url(#glowGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="33" font-weight="800" letter-spacing="-0.5">
      Monitoring &amp; Energy Intelligence
    </text>

    <!-- Subtitle Tags -->
    <text x="0" y="148" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">
      ⚡ HVAC Optimization  •  📊 Energy Analytics  •  🏢 Digital Twins  •  🌱 ESG &amp; Decarbonization
    </text>

    <!-- Tech Badges Bar in SVG -->
    <g transform="translate(0, 168)" opacity="0.9">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="95" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="47" y="15" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="10.5" font-weight="600">BACnet / MQTT</text>
      <!-- Tag 2 -->
      <rect x="103" y="0" width="105" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="155" y="15" text-anchor="middle" fill="#10b981" font-family="sans-serif" font-size="10.5" font-weight="600">Brick / Haystack</text>
      <!-- Tag 3 -->
      <rect x="216" y="0" width="85" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="258" y="15" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="10.5" font-weight="600">EnergyPlus</text>
      <!-- Tag 4 -->
      <rect x="309" y="0" width="75" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="346" y="15" text-anchor="middle" fill="#a855f7" font-family="sans-serif" font-size="10.5" font-weight="600">OpenEMS</text>
      <!-- Tag 5 -->
      <rect x="392" y="0" width="80" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="432" y="15" text-anchor="middle" fill="#06b6d4" font-family="sans-serif" font-size="10.5" font-weight="600">VOLTTRON</text>
    </g>
  </g>
</svg>